variables:
  CI_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/$CI_COMMIT_REF_SLUG:$CI_PIPELINE_ID
  CI_DEV_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/dev/$CI_COMMIT_REF_SLUG:$CI_PIPELINE_ID
  BASE_URL: https://nca:nca@nevercodealone.projects.nevercodealone.de

stages:
  - build
  - codeanalysis
  - deploy_stage
  - trigger_test
  - deploy_live
  - trigger_live_tests

cypress_full_test_preview_stage:
  stage: trigger_test
  trigger:
    project: never-code-alone/never-code-alone-cypress-basis-tests
    branch: main
    strategy: depend
  variables:
    CYPRESS_BASE_URL: https://nca:nca@nevercodealone.projects.nevercodealone.de
    RECORD_TRIGGER: "true"
    TESTS_FAILED_cypress_full_test_preview_stage: $CI_JOB_STATUS == 'success'

cypress_custom_tests_preview_stage:
  stage: trigger_test
  trigger:
    project: never-code-alone/nca-cypress-nevercodealon-custom
    branch: main
    strategy: depend
  variables:
    CYPRESS_BASE_URL: https://nca:nca@nevercodealone.projects.nevercodealone.de
    RECORD_TRIGGER: "true"
    TESTS_FAILED_cypress_custom_tests_preview_stage: $CI_JOB_STATUS == 'success'

validate_html_stage:
  stage: trigger_test
  image: $CI_DEV_IMAGE
  tags:
    - docker1
  variables:
    BASE_URL: https://nca:nca@nevercodealone.projects.nevercodealone.de
  needs:
    - job: deploy_stage
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd /var/www/html
    - php bin/validate-html.php

build:
  stage: build
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -f Dockerfile.conversis --target webserver-live -t $CI_IMAGE --pull .
    - docker push $CI_IMAGE
    - docker build -f Dockerfile.conversis --target webserver-dev -t $CI_DEV_IMAGE --pull .
    - docker push $CI_DEV_IMAGE
  tags:
    - docker1

codeanalysis_phpunit:
  stage: codeanalysis
  image: $CI_DEV_IMAGE
  script:
    - cd /var/www/html
    - vendor/bin/phpunit --testdox
  tags:
    - docker1

codeanalysis_phpstan:
  stage: codeanalysis
  image: $CI_DEV_IMAGE
  script:
    - cd /var/www/html
    - vendor/bin/phpstan analyse --configuration=phpstan-ci.neon
  tags:
    - docker1

dumpfinder:
  stage: codeanalysis
  image: $CI_DEV_IMAGE
  script:
    - cd /var/www/html
    - ./dumpFinder.sh
  tags:
    - docker1

.deploy:
  image: docker:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - echo "DEBUG SHORTCODE=$SHORTCODE SHORTCODE1=$SHORTCODE1"
    - rm -rf /tmp/uploads /tmp/public-uploads
    - docker cp $SHORTCODE-web:/var/www/html/var/uploads /tmp/ || true
    - docker cp $SHORTCODE-web:/var/www/html/public/uploads /tmp/public-uploads || true
    - du -sh /tmp/public-uploads || true
    - docker compose -f docker-compose.conversis.yml -p $SHORTCODE1 rm -sfv ||true
    - docker volume rm $SHORTCODE1"_var" ||true
  script:
    - docker exec mariadb /bin/clonedb.sh $DB_USER $DB_NAME ${PREFIX}_${DB_NAME}
    - DB_NAME=${PREFIX}_${DB_NAME} docker compose -f docker-compose.conversis.yml -p $SHORTCODE1 up -d --remove-orphans
    - docker cp /tmp/uploads $SHORTCODE1-web:/var/www/html/var/
    - docker cp /tmp/public-uploads/. $SHORTCODE1-web:/var/www/html/public/uploads
    - docker exec $SHORTCODE1-web chown -R www-data:www-data /var/www/html/var/uploads/ /var/www/html/public/uploads/ 2>/dev/null || true
    - docker exec $SHORTCODE1-web rm -rf var/cache
    - docker exec $SHORTCODE1-web sh -c 'mkdir -p var/cache && chown -R www-data:www-data var/cache' || true
    - docker exec --user www-data $SHORTCODE1-web php bin/console cache:warmup --env=prod --no-debug
    - docker exec --user www-data $SHORTCODE1-web php bin/websiteconsole cache:warmup --env=prod --no-debug

deploy_stage:
  stage: deploy_stage
  tags:
    - docker2
  only:
    - main
  extends: .deploy
  resource_group: stage-deploy
  environment:
    name: stage
    url: https://$URL
  variables:
    IMAGE: $CI_DEV_IMAGE
    SHORTCODE1: stage-$SHORTCODE
    DATABASE_URL: mysql://$DB_USER:$DB_PWD@$DB_HOST:3306/${PREFIX}_${DB_NAME}
    PREFIX: stage

deploy_branch:
  stage: deploy_stage
  tags:
    - docker2
  except:
    - main
  extends: .deploy
  resource_group: stage-deploy
  environment:
    name: $CI_COMMIT_BRANCH
    url: https://$URL
  variables:
    IMAGE: $CI_DEV_IMAGE
    SHORTCODE1: $CI_COMMIT_BRANCH-$SHORTCODE
    DATABASE_URL: mysql://$DB_USER:$DB_PWD@$DB_HOST:3306/${PREFIX}_${DB_NAME}
    URL: $CI_COMMIT_BRANCH.$URL
    PREFIX: $CI_COMMIT_BRANCH

.deploy_live:
  stage: deploy_live
  tags:
    - docker2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image: docker:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - rm -rf /tmp/live-public-uploads
    - docker cp $SHORTCODE1-web:/var/www/html/public/uploads /tmp/live-public-uploads || true
  script:
    - docker compose -f docker-compose.conversis.yml -p $SHORTCODE1 up -d --remove-orphans
    - docker cp /tmp/live-public-uploads/. $SHORTCODE1-web:/var/www/html/public/uploads || true
    - docker exec $SHORTCODE1-web chown -R www-data:www-data /var/www/html/public/uploads 2>/dev/null || true
    - docker exec $SHORTCODE1-web rm -rf var/cache
    - docker exec $SHORTCODE1-web sh -c 'mkdir -p var/cache && chown -R www-data:www-data var/cache' || true
    - docker exec --user www-data $SHORTCODE1-web php bin/console cache:warmup --env=prod --no-debug
    - docker exec --user www-data $SHORTCODE1-web php bin/websiteconsole cache:warmup --env=prod --no-debug
  environment:
    name: live
    url: https://$URL
  variables:
    IMAGE: $CI_IMAGE
    SHORTCODE1: $SHORTCODE
    DATABASE_URL: mysql://$DB_USER:$DB_PWD@$DB_HOST:3306/$DB_NAME

deploy_live:
  extends: .deploy_live
  when: on_success
  needs:
    - cypress_full_test_preview_stage
    - cypress_custom_tests_preview_stage
    - validate_html_stage

deploy_live_manual:
  extends: .deploy_live
  when: manual
  allow_failure: true
  needs: []

cypress_internal_links_test_live:
  stage: trigger_live_tests
  trigger:
    project: never-code-alone/never-code-alone-cypress-basis-tests
    branch: main
    strategy: depend
  variables:
    CYPRESS_BASE_URL: https://nevercodealone.de
    CYPRESS_SPEC: "cypress/e2e/internal-links.cy.ts"
    RECORD_TRIGGER: "true"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  needs:
    - job: deploy_live

