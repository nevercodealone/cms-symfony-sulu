# Learn more about services, parameters and containers at
# http://symfony.com/doc/current/book/service_container.html
parameters:
    default_locale: de

    # parameter_name: value
    google_api_key: '%env(GOOGLE_API_KEY)%'
    twitter_api_key: '%env(TWITTER_API_KEY)%'
    twitter_api_secret: '%env(TWITTER_API_SECRET)%'
    twitter_access_token: '%env(TWITTER_ACCESS_TOKEN)%'
    twitter_access_secret: '%env(TWITTER_ACCESS_SECRET)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        bind:
            $twitter_api_key: '%twitter_api_key%'
            $twitter_api_secret: '%twitter_api_secret%'
            $twitter_access_token: '%twitter_access_token%'
            $twitter_access_secret: '%twitter_access_secret%'
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.



    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\ContactForm\ContactLeadMailer:
        arguments:
            $recipientEmail: '%env(CONTACT_LEAD_EMAIL)%'

    App\Telegram\TelegramNotifier:
        arguments:
            $botToken: '%env(TELEGRAM_BOT_TOKEN)%'
            $defaultChatId: '%env(TELEGRAM_DEFAULT_CHAT_ID)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    \Twig_Extensions_Extension_Intl:
        class: Twig_Extensions_Extension_Intl

    Google_Client:
        class: \Google_Client
        calls:
            - method: setApplicationName
              arguments:
                  - 'API Samples'

            - method: setDeveloperKey
              arguments:
                  - '%google_api_key%'

    Google_Service_YouTube:
        class: \Google_Service_YouTube
        arguments:
            - '@Google_Client'
    
    Google\Client:
        class: Google\Client
        calls:
            - method: setApplicationName
              arguments:
                  - 'API Samples'
            - method: setDeveloperKey
              arguments:
                  - '%google_api_key%'

    Google\Service\YouTube:
        class: Google\Service\YouTube
        arguments:
            - '@Google\Client'

    # Sulu Document Manager Alias for API Controller
    Sulu\Component\DocumentManager\DocumentManagerInterface:
        alias: sulu_document_manager.document_manager
        public: true

    # Sulu Block Services (supports all 32 block types)
    App\Sulu\Block\BlockTypeRegistry:
        public: true

    App\Sulu\Block\BlockExtractor:
        arguments:
            $registry: '@App\Sulu\Block\BlockTypeRegistry'
        public: true

    App\Sulu\Block\BlockWriter:
        arguments:
            $registry: '@App\Sulu\Block\BlockTypeRegistry'
        public: true

    # HTTP Cache Clearer for MCP/CLI operations
    App\Sulu\Cache\HttpCacheClearer:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    # Sulu Page Service - Direct SQL (bypasses DocumentManager for MCP compatibility)
    App\Sulu\Service\PageService:
        arguments:
            $cacheManager: '@?sulu_http_cache.cache_manager'
            $fosCacheManager: '@?fos_http_cache.cache_manager'
            $blockTypeRegistry: '@App\Sulu\Block\BlockTypeRegistry'
            $blockExtractor: '@App\Sulu\Block\BlockExtractor'
            $blockWriter: '@App\Sulu\Block\BlockWriter'
            $httpCacheClearer: '@App\Sulu\Cache\HttpCacheClearer'
            $snippetService: '@App\Sulu\Service\SnippetService'
            $referenceScanner: '@App\Sulu\Service\PageReferenceScanner'
            $projectDir: '%kernel.project_dir%'
        public: true

    # Sulu Page Reference Scanner - DBAL scanner for incoming page references
    App\Sulu\Service\PageReferenceScanner:
        arguments:
            $connection: '@doctrine.dbal.default_connection'
        public: true

    # Sulu Snippet Schema Reader - parses config/templates/snippets/*.xml
    App\Sulu\Service\SnippetSchemaReader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Sulu Snippet Service - Direct SQL for snippet operations
    App\Sulu\Service\SnippetService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $schemaReader: '@App\Sulu\Service\SnippetSchemaReader'
        public: true

    # Latest Articles Service - Direct SQL for fetching most recently created pages
    App\Sulu\Service\LatestArticlesService:
        public: true

    # Sulu Media Service - Direct SQL for media operations + MediaManager for uploads
    App\Sulu\Service\MediaService:
        arguments:
            $mediaManager: '@sulu_media.media_manager'
        public: true

    # MCP Tools
    App\MCP\Tools\SuluPagesTool:
        arguments:
            $pageService: '@App\Sulu\Service\PageService'
            $blockTypeRegistry: '@App\Sulu\Block\BlockTypeRegistry'
            $snippetService: '@App\Sulu\Service\SnippetService'
            $mediaService: '@App\Sulu\Service\MediaService'
        tags: ['klp_mcp_server.tool']
        public: true

    # MCP OpenAPI Generator
    App\MCP\OpenApi\OpenApiGenerator:
        arguments:
            $suluPagesTool: '@App\MCP\Tools\SuluPagesTool'
            $blockTypeRegistry: '@App\Sulu\Block\BlockTypeRegistry'
        public: true

    # MCP OAuth Security
    App\Security\McpTokenAuthenticator:
        autoconfigure: true

    App\Security\McpUserProvider:
        autoconfigure: true

    App\Service\McpOAuthService:
        autoconfigure: true

